<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0D0B08" />
  <title>Quoridor | ramiyounes.dev</title>
  <link rel="icon" href="../../assets/images/fs.png" type="image/png">
  <script>
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('theme') || 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Fraunces:ital,opsz,wght@1,9..144,300&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/game.css" />
  <link rel="stylesheet" href="../styles/setup.css" />
  <link rel="stylesheet" href="../styles/howto.css" />
</head>
<body class="game-body" data-game="quoridor">

  <div id="canvas-container"></div>

  <header id="top-bar">
    <a id="back-link" href="../"><span aria-hidden="true">&larr;</span> Explore</a>
    <span class="top-title">Quoridor</span>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme"><span class="theme-dot" aria-hidden="true"></span></button>
  </header>

  <div id="hud">
    <div id="hud-row-top">
      <div class="player-card" id="card-a">
        <span class="pc-name"><span class="pc-swatch" aria-hidden="true"></span>Amber<span id="you-a" class="you-badge hidden"></span></span>
        <span class="pc-count"><span id="count-a">0</span> <small>walls</small></span>
        <span class="pc-score" id="score-a">0 wins</span>
      </div>
      <div id="hud-center">
        <div id="hud-turn">Amber's turn</div>
        <div id="hud-hint" aria-live="polite"></div>
      </div>
      <div class="player-card" id="card-b">
        <span class="pc-name"><span class="pc-swatch" aria-hidden="true"></span>Ivory<span id="you-b" class="you-badge hidden"></span></span>
        <span class="pc-count"><span id="count-b">0</span> <small>walls</small></span>
        <span class="pc-score" id="score-b">0 wins</span>
      </div>
    </div>
  </div>

  <div id="action-bar">
    <button id="btn-move" class="ctrl-btn active" type="button" aria-pressed="true">Move <span class="kbd">M</span></button>
    <button id="btn-wall" class="ctrl-btn" type="button" aria-pressed="false">Wall <span class="kbd">W</span></button>
    <button id="btn-rotate" class="ctrl-btn" type="button" aria-label="Rotate wall" disabled>&#8635; Rotate <span class="kbd">R</span></button>
    <button id="btn-wall-confirm" class="ctrl-btn primary hidden" type="button">Place wall</button>
    <span class="btn-sep" aria-hidden="true"></span>
    <button id="btn-reset" class="ctrl-btn" type="button">Restart</button>
    <button id="btn-change-mode" class="ctrl-btn" type="button">Menu</button>
  </div>

  <div id="mode-overlay" role="dialog" aria-modal="true" aria-labelledby="mode-title">
    <div id="mode-box">
      <div class="mode-kicker"><span>Fig. 01</span><span>Explore</span></div>
      <h1 id="mode-title">Quoridor</h1>
      <div id="mode-sub">Choose a game mode</div>
      <div id="mode-buttons">
        <button class="mode-btn" data-mode="local" type="button"><span class="mb-n">01</span><span>Two players<span class="mb-sub">Same device, take turns</span></span><span class="mb-arrow" aria-hidden="true">&rarr;</span></button>
        <button class="mode-btn" data-mode="ai" type="button"><span class="mb-n">02</span><span>Versus AI<span class="mb-sub">You play Amber</span></span><span class="mb-arrow" aria-hidden="true">&rarr;</span></button>
        <button class="mode-btn" data-mode="online" type="button"><span class="mb-n">03</span><span>Online<span class="mb-sub">Play a friend with a room code</span></span><span class="mb-arrow" aria-hidden="true">&rarr;</span></button>
      </div>
      <div id="lobby-panel" class="hidden">
        <input id="room-input" type="text" maxlength="12" placeholder="Room code, e.g. ABCD" autocomplete="off" spellcheck="false" autocapitalize="characters" />
        <button id="btn-join-room" type="button">Join room</button>
        <div id="lobby-status" aria-live="polite"></div>
        <button id="btn-lobby-back" class="text-link" type="button">Back</button>
      </div>

      <button id="btn-how-to-play" class="how-to-play-link" type="button">How to play</button>
    </div>
  </div>

  <div id="reset-confirm" class="hidden" role="dialog" aria-modal="true">
    <div id="reset-confirm-box">
      <p>Restart this game?</p>
      <div class="confirm-btns">
        <button id="btn-confirm-yes" class="ctrl-btn" type="button">Yes</button>
        <button id="btn-confirm-no" class="ctrl-btn" type="button">No</button>
      </div>
    </div>
  </div>

  <div id="win-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="win-message">
    <div id="win-box">
      <div id="win-icon" aria-hidden="true">&#9823;</div>
      <div id="win-message">Amber wins!</div>
      <div id="win-sub">Reached the other side</div>
      <div class="win-actions">
        <button id="btn-win-reset" type="button">Play again</button>
        <a href="../" class="win-back">&larr; Back to Explore</a>
      </div>
    </div>
  </div>

  <script type="module" src="../js/quoridor/main.js"></script>
  <script type="module" src="../js/quoridor/interaction.js"></script>
</body>
</html>
