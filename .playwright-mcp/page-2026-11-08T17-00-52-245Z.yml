      - paragraph [ref=f9e102]: "The grid stands upright: 7 columns of 6 holes. Amber and Ivory take turns, one disc per turn. Amber plays first."
    - generic [ref=f9e103]:
      - text: Dropping a disc
      - paragraph [ref=f9e151]: Pick a column and your disc falls to the lowest free hole. A full column cannot take more discs.
    - generic [ref=f9e152]:
      - text: Block and build
      - paragraph [ref=f9e199]: Watch the other player's lines and drop into the gap before they finish. A disc can block one line and start another.
    - generic [ref=f9e200]:
      - text: Winning
      - paragraph [ref=f9e245]: Four in a row ends the game at once. If the grid fills up with no line of four, it is a draw. Wins add up across rematches.
    - generic [ref=f9e246]:
      - text: Controls
      - paragraph [ref=f9e292]: Click a column to drop a disc. With the keyboard, ← → pick a column and Enter drops, or press 1 to 7.
