  - heading "nim" [level=3] [ref=f9e738]
  - generic [ref=f9e739]:
    - generic [ref=f9e740]:
      - text: Goal
      - paragraph [ref=f9e744]: Players take matches from the piles in turn. By default (misère), whoever takes the last match loses. In normal mode, the last match wins.
    - generic [ref=f9e745]:
      - text: The piles
      - paragraph [ref=f9e779]: The game starts with piles of 1, 3, 5 and 7 matches. The host can pick another preset or a random setup.
    - generic [ref=f9e780]:
      - text: Your turn
      - paragraph [ref=f9e815]: "Take at least one match from exactly one pile: any number, up to the whole pile. Tap a match to select it and every match to its right, then confirm."
    - generic [ref=f9e816]:
      - text: Think ahead
      - paragraph [ref=f9e826]: Every move changes what your opponents can do next. Try to leave a position where any move they make helps you. If your turn timer runs out, one match is taken from a random pile for you.
    - generic [ref=f9e827]:
      - generic [ref=f9e828]:
        - generic [ref=f9e830]: "5"
        - generic [ref=f9e831]: games
      - text: Scoring
      - paragraph [ref=f9e832]: With 2 players, the winner of each game scores 1. With 3 or more in misère, everyone except the player who took the last match gets +1; in normal mode, the taker gets +2. After 5 games by default, the highest total wins.
