  - heading "dama" [level=3] [ref=f7e415]
  - generic [ref=f7e416]:
    - generic [ref=f7e417]:
      - text: Goal
      - paragraph [ref=f7e490]: Capture every piece of the other player, or leave them with no legal move. Either way, you win.
    - generic [ref=f7e491]:
      - text: The board
      - paragraph [ref=f7e590]: An 8 × 8 board, all squares used. Each side has 16 pieces on its second and third rows. Amber plays first.
    - generic [ref=f7e591]:
      - text: Moving
      - paragraph [ref=f7e626]: A piece moves one square forward, left or right. Never backward, never diagonally.
    - generic [ref=f7e627]:
      - text: Capturing
      - paragraph [ref=f7e664]: Jump over an enemy piece next to you onto the empty square behind it, forward or sideways. If you can jump again, the same piece keeps going.
    - generic [ref=f7e665]:
      - text: Take the most
      - paragraph [ref=f7e707]: Capturing is mandatory. When there is a choice, you must take the path that captures the most pieces.
    - generic [ref=f7e708]:
      - text: Kings
      - paragraph [ref=f7e746]: Reach the far row to become a King. A King moves any distance in a straight line, backward too, and captures from afar, landing on any free square past the piece.
    - generic [ref=f7e747]:
      - text: Controls
      - paragraph [ref=f7e782]: Click a piece, then a dot to move it. When a capture is mandatory, the pieces that must capture glow and rings show where to land. Esc cancels a selection.
