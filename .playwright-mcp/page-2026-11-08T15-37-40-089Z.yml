  - generic [ref=f7e4]:
    - generic [ref=f7e5]:
      - text: Goal
      - paragraph [ref=f7e93]: Race your pawn to the opposite side of the board. Amber goes down, Ivory goes up. The first pawn to reach any square of the far row wins.
    - generic [ref=f7e94]:
      - generic [ref=f7e95]:
        - generic [ref=f7e200]: "10"
        - generic [ref=f7e201]: "10"
      - text: Board and walls
      - paragraph [ref=f7e202]: The board has 9 × 9 squares. Each pawn starts in the middle of its own edge, and each player has 10 walls. Amber plays first.
    - generic [ref=f7e203]:
      - text: Moving
      - paragraph [ref=f7e236]: On your turn, either move or place a wall. A move is one square up, down, left or right. No diagonals, and never through a wall.
    - generic [ref=f7e237]:
      - text: Jumping
      - paragraph [ref=f7e275]: If the other pawn is right next to you, jump over it. If a wall or the edge stops the jump, step diagonally to either side of it instead.
    - generic [ref=f7e276]:
      - text: Placing walls
      - paragraph [ref=f7e309]: A wall covers two squares, flat or upright, in the groove between squares. Walls cannot overlap or cross, and they stay until the end of the game.
    - generic [ref=f7e310]:
      - text: Always a way through
      - paragraph [ref=f7e350]: You can slow a pawn down, but you can never close every path to its goal. A wall that would do it is refused and turns red.
