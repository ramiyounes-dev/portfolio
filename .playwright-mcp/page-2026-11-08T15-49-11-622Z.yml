      - paragraph [ref=f8e475]: Place a disc so that one or more straight lines of the other colour sit between your new disc and another of yours. Across, up and down, or diagonally. Legal moves show as dots.
    - generic [ref=f8e476]:
      - text: Flip
      - paragraph [ref=f8e551]: Every trapped disc flips to your colour. A move is only allowed if it flips at least one disc.
